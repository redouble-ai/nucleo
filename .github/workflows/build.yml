# Builds the reactor, generates the documentation site and runs the tests, on every pull
# request and on every push to main. The site comes before the tests because its generator
# verifies the documentation (every page in the reading order, every link and anchor
# resolving), which is the cheapest check to fail on; the generated site is attached to the
# run so a reviewer reads it without building.
name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Source conventions
        # Every Java source carries the license header and names only human authors
        # (CLAUDE.md). Java files under resources are documents of the demo corpus, not source.
        run: |
          sources=$(git ls-files '*.java' | grep -v -e /src/main/resources/ -e /src/test/resources/)
          missing=$(echo "$sources" | xargs grep -L 'Licensed under the Apache-2.0 license' || true)
          ai=$(echo "$sources" | xargs grep -l -iE '@author.*(claude|chatgpt|gpt|copilot|gemini|anthropic|openai)' || true)
          if [ -n "$missing$ai" ]; then
            printf 'Missing the license header:\n%s\nAn AI named as author:\n%s\n' "$missing" "$ai"
            exit 1
          fi
      - name: Build
        run: mvn -B -ntp install -DskipTests
      - name: Documentation site
        run: mvn -B -ntp site
      - name: Attach the documentation site
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: src/main/docs
      - name: Tests
        run: mvn -B -ntp verify

  # Contributions come in under the Developer Certificate of Origin (CONTRIBUTING.md): every
  # commit of a pull request carries the sign-off line that `git commit -s` appends.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "$sha has no Signed-off-by line; commit with git commit -s (see DCO)"
              missing=1
            fi
          done
          exit $missing
