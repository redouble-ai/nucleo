# The runtime's credentials, read as MicroProfile Config the way any Quarkus property is. A
# provider asks the runtime for the name it needs (anthropic-api-key) and QuarkusSecrets reads
# nucleo.credentials.<name>, with .user and .host for a credential's other parts. Each is bound
# from the environment variable AGENTS.md names; a deployment binds it from a profile, a vault
# or a config source of its own, the way it binds quarkus.datasource.password. AWS is three
# values: the region, and the key pair as .user (the access key id) and the secret. A pair left
# with either half empty hands the AWS SDK its own chain, so a profile or an instance role works
# with nothing exported; the region has no default, because a deployment's region is its own.
nucleo.credentials.aws-region=${AWS_REGION:}
nucleo.credentials.aws-access-key-id.user=${AWS_ACCESS_KEY_ID:}
nucleo.credentials.aws-access-key-id=${AWS_SECRET_ACCESS_KEY:}
nucleo.credentials.anthropic-api-key=${ANTHROPIC_API_KEY:}
nucleo.credentials.openai-api-key=${OPENAI_API_KEY:}
nucleo.credentials.openai-compatible-api-key=${OPENAI_COMPATIBLE_API_KEY:}
nucleo.credentials.openai-compatible-api-key.host=${OPENAI_COMPATIBLE_API_KEY_HOST:}
nucleo.credentials.azure-foundry-api-key=${AZURE_FOUNDRY_API_KEY:}
nucleo.credentials.azure-foundry-api-key.host=${AZURE_FOUNDRY_API_KEY_HOST:}
nucleo.credentials.systemone-api-key=${SYSTEMONE_API_KEY:}
nucleo.credentials.systemone-api-key.host=${SYSTEMONE_API_KEY_HOST:}

# The container drains in-flight requests before the runtime stops; above the longest job the
# demo runs (one quick question, six minutes at most)
quarkus.shutdown.timeout=7M

# The JAX-RS endpoints serve at the root, beside the static page; every refusal body is
# built by DemoResource.refusal, so the message the page reads is the endpoint's own
quarkus.rest.path=/

# Each @QuarkusTest that changes configuration restarts the application in the same JVM; on a fixed
# test port the restart can race the previous server's release of it. An ephemeral port per test app
# removes the race. Tests only.
quarkus.http.test-port=0

# The shipped corpus and the account catalog are read from the classpath at runtime, so the
# native image must carry them; the Nucleo extension already includes the skill bundles and the
# provider catalog fragments.
quarkus.native.resources.includes=corpus/**,corpus.manifest,models.json

# The Bedrock extension is on the classpath for its native-image metadata only; the provider
# builds its own client against the real service, so no LocalStack container is started for it
quarkus.bedrockruntime.devservices.enabled=false

# The page's script and stylesheet change with every release of the demo, and a page running
# an older script against newer endpoints breaks: Quarkus's default marks static files
# immutable for a day, so caching is off and the browser fetches them fresh
quarkus.http.static-resources.caching-enabled=false

quarkus.log.category."ai.redouble".level=INFO
